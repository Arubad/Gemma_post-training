# E4B prompt-only baseline (the control arm for every E4B ablation).
name: e4b_prompt
model: e4b
variant: single
root:
  name: coder
  description: Autonomous software engineer that fixes issues in a Python repository.
  adapter: null
  instruction: prompts/system.md
  tools: [run_command, read_file, edit_file, write_file, search_similar_code, get_code_neighbors, get_code_subgraph, get_status, submit_patch]
sampling:
  temperature: 0.4
  top_p: 0.95
  top_k: 64
  max_output_tokens: 4096
  seed: 1234
  thinking_budget: 0
evaluation:
  timeout_seconds: 120
  max_tool_calls: 40
  max_time_minutes: 5
  max_turns: 80
